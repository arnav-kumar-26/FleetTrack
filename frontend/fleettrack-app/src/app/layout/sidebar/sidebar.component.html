<aside class="sidebar z-20">
  <div class="sidebar-header">
    <span class="sidebar-logo-icon">
      <svg lucideIcon="car" [size]="18" [strokeWidth]="2" color="white" />
    </span>
    <span class="sidebar-logo-text">FleetTrack</span>
  </div>

  <nav class="sidebar-nav">
    <p class="sidebar-section-title">Menu</p>
    <a routerLink="/dashboard" routerLinkActive="nav-active" class="nav-item">
      <span class="nav-icon"><svg lucideIcon="layout-dashboard" [size]="20" [strokeWidth]="1.75" /></span>
      <span class="nav-label">Dashboard</span>
    </a>
    <a routerLink="/vehicles" routerLinkActive="nav-active" class="nav-item">
      <span class="nav-icon"><svg lucideIcon="car" [size]="20" [strokeWidth]="1.75" /></span>
      <span class="nav-label">Vehicles</span>
    </a>

    <p class="sidebar-section-title">General</p>
    <button type="button" class="nav-item nav-btn" (click)="settings.emit()">
      <span class="nav-icon"><svg lucideIcon="settings" [size]="20" [strokeWidth]="1.75" /></span>
      <span class="nav-label">Settings</span>
    </button>
    <button type="button" class="nav-item nav-btn" (click)="help.emit()">
      <span class="nav-icon"><svg lucideIcon="circle-help" [size]="20" [strokeWidth]="1.75" /></span>
      <span class="nav-label">Help</span>
    </button>
    <button type="button" class="nav-item nav-btn" (click)="logout.emit()">
      <span class="nav-icon"><svg lucideIcon="log-out" [size]="20" [strokeWidth]="1.75" /></span>
      <span class="nav-label">Logout</span>
    </button>
  </nav>
</aside>
