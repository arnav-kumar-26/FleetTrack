<div class="min-h-screen bg-page p-2">
  <main class="flex h-[calc(100vh_-_1rem)] gap-grid-gutter">
    <app-sidebar *ngIf="isAuthenticated()" (logout)="logout()" />
    <div *ngIf="isAuthenticated()" class="flex min-w-0 flex-1 flex-col gap-grid-gutter">
      <app-header
        [currentUser]="currentUser()"
        [initials]="initials()"
      />
      <div class="canvas min-w-0 flex-1 overflow-y-auto rounded-shell shadow-shell">
        <router-outlet />
      </div>
    </div>
    <div *ngIf="!isAuthenticated()" class="min-w-0 flex-1">
      <router-outlet />
    </div>
  </main>
</div>
